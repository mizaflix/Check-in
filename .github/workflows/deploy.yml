name: CI/CD – Build & Deploy (Portainer)

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # mizaflix/check-in

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build e push da imagem para o GitHub Container Registry (ghcr.io)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # necessário para escrever no ghcr.io

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata (tags & labels) da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Aciona o Portainer via webhook para redesenhar a stack
  #    O Portainer puxa o docker-compose.yml do repositório e faz o redeploy
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Acionar Portainer Webhook
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Portainer Stack Webhook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
