<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background-color: #f4f4f4; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 414px; min-height: 100vh; background-color: #ffffff; padding: 20px; display: flex; flex-direction: column;}
        header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .back-link { color: #008f68; text-decoration: none; font-size: 1.2rem; }
        .profile-pic-container { text-align: center; margin-bottom: 30px; }
        .profile-pic { width: 80px; height: 80px; background-color: #e0ece7; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; font-size: 2rem; color: #008f68; margin-bottom: 10px; }
        .change-photo { color: #008f68; font-size: 0.9rem; font-weight: 700; text-decoration: none; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 8px; }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; outline: none; background: #fafafa; }
        .toggles { margin-top: 10px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f0f0f0;}
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #008f68; }
        input:checked + .slider:before { transform: translateX(20px); }
        .btn-submit { background-color: #008f68; color: white; border: none; padding: 16px; border-radius: 25px; font-size: 1rem; font-weight: 700; width: 100%; cursor: pointer; margin-top: auto; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <a href="{{ url_for('configuracoes') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 style="font-size: 1.2rem; color: #333;">Minha conta</h1>
        </header>

        <div class="profile-pic-container">
            <div class="profile-pic"><i class="fa-regular fa-user"></i></div><br>
            <a href="#" class="change-photo">Trocar foto</a>
        </div>

        <form action="{{ url_for('minha_conta') }}" method="POST" style="display: flex; flex-direction: column; flex: 1;">
            <div class="form-group"><label>Nome completo</label><input type="text" name="nome" value="{{ current_user.nome }}" required></div>
            <div class="form-group"><label>Telefone</label><input type="tel" name="telefone" value="{{ current_user.telefone or '' }}"></div>

            <div class="toggles">
                <div class="toggle-row">
                    <p style="font-weight: 600;">Professor(a)</p>
                    <label class="switch">
                        <input type="checkbox" {% if current_user.is_professor %}checked{% endif %} disabled>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <p style="font-weight: 600;">Administrador</p>
                    <label class="switch">
                        <input type="checkbox" {% if current_user.is_admin %}checked{% endif %} disabled>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Atualizar conta</button>
        </form>
    </div>
</body>
</html>
