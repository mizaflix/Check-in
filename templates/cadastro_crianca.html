<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Criança - CheckKids</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           ESTILOS GERAIS (BASE)
        ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .text-green { color: #008f68; }
        .bg-green { background-color: #008f68; color: white; }

        /* ==========================================
           CABEÇALHO
        ========================================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-link {
            text-decoration: none;
            color: #008f68;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bell-icon {
            font-size: 1.2rem;
            color: #008f68;
        }

        /* ==========================================
           FORMULÁRIO E UPLOAD DE FOTO
        ========================================== */
        .photo-upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .photo-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #f0f4f3;
            border: 2px dashed #008f68;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #008f68;
            font-size: 1.5rem;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .photo-circle { overflow: hidden; position: relative; }
        .photo-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: none; }
        .detail-field { display: none; margin: -5px 0 15px 0; }
        .detail-field textarea { width: 100%; min-height: 70px; resize: vertical; border: 1px solid #d8e5e0; border-radius: 10px; padding: 11px 13px; font: inherit; box-sizing: border-box; outline: none; }
        .detail-field textarea:focus { border-color: #008f68; }

        .photo-warning {
            background-color: #ffeaea;
            color: #d9534f;
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
            margin-left: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #333;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #008f68;
        }

        .row-group {
            display: flex;
            gap: 10px;
        }

        .row-group .form-group {
            flex: 1;
        }

        /* Checkboxes customizados */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #008f68;
            width: 16px;
            height: 16px;
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: #333;
            margin: 0;
            line-height: 1.4;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: auto; /* Empurra o botão para o fundo */
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <a href="{{ url_for('dashboard') }}" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Adicionar criança
            </a>
            <i class="fa-regular fa-bell bell-icon"></i>
        </header>

        <form action="{{ url_for('cadastrar_crianca') }}" method="POST" enctype="multipart/form-data">
            
            <div class="photo-upload-container">
                <label for="foto" class="photo-circle">
                    <i class="fa-regular fa-image" id="foto-icon"></i>
                    <img id="foto-preview" src="" alt="Pré-visualização da foto da criança">
                </label>
                <input type="file" id="foto" name="foto" style="display: none;" accept="image/*">
                
                <div class="photo-warning">
                    <i class="fa-solid fa-circle-exclamation"></i> Adicionar imagem é importante para identificação
                </div>
            </div>

            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" name="nome" class="form-control" placeholder="Digite seu nome completo" required>
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label>Data de nascimento</label>
                    <input type="date" name="data_nascimento" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Sexo</label>
                    <select name="sexo" class="form-control" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="restricao_alimentar" name="tem_restricao_alimentar">
                <label for="restricao_alimentar">Possui alguma restrição alimentar?</label>
            </div>
            <div class="detail-field" id="restricao-detalhe">
                <textarea name="restricao_alimentar" id="restricao_texto" placeholder="Ex.: intolerância à lactose, dieta sem açúcar..."></textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="alergia" name="tem_alergia">
                <label for="alergia">Possui alguma alergia?</label>
            </div>
            <div class="detail-field" id="alergia-detalhe">
                <textarea name="alergia" id="alergia_texto" placeholder="Ex.: amendoim, leite, medicamento..."></textarea>
            </div>

            <button type="submit" class="btn-submit bg-green">Cadastrar</button>
        </form>

    </div>

    <script>
        const inputFoto = document.getElementById('foto');
        const fotoPreview = document.getElementById('foto-preview');
        const fotoIcon = document.getElementById('foto-icon');
        const restricaoCheck = document.getElementById('restricao_alimentar');
        const restricaoDetalhe = document.getElementById('restricao-detalhe');
        const restricaoTexto = document.getElementById('restricao_texto');
        const alergiaCheck = document.getElementById('alergia');
        const alergiaDetalhe = document.getElementById('alergia-detalhe');
        const alergiaTexto = document.getElementById('alergia_texto');

        inputFoto.addEventListener('change', () => {
            const arquivo = inputFoto.files && inputFoto.files[0];
            if (!arquivo) return;
            const url = URL.createObjectURL(arquivo);
            fotoPreview.src = url;
            fotoPreview.style.display = 'block';
            fotoIcon.style.display = 'none';
            fotoPreview.onload = () => URL.revokeObjectURL(url);
        });

        function atualizarCampo(checkbox, container, textarea) {
            const ativo = checkbox.checked;
            container.style.display = ativo ? 'block' : 'none';
            textarea.required = ativo;
            if (!ativo) textarea.value = '';
        }

        restricaoCheck.addEventListener('change', () => atualizarCampo(restricaoCheck, restricaoDetalhe, restricaoTexto));
        alergiaCheck.addEventListener('change', () => atualizarCampo(alergiaCheck, alergiaDetalhe, alergiaTexto));
    </script>
</body>
</html>
