<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de responsável - CheckKids</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <a href="{{ url_for('login') }}" class="text-primary-green text-decoration-none">← Voltar</a>
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" height="30">
        </div>

        <h2 class="text-primary-green">Cadastro de responsável</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 18px;">Crie sua conta para cadastrar e acompanhar suas crianças no CheckKids.</p>
        <div style="background:#edf7f2;border:1px solid #d5eadf;color:#23634f;padding:13px 14px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:22px;">Este cadastro é exclusivo para responsáveis. Professores, auxiliares e administradores recebem acesso diretamente pela administração do sistema.</div>

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="input-group-custom">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="Digite seu melhor e-mail" required>
            </div>
            <div class="input-group-custom">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="Digite uma senha forte" required>
            </div>


            <button type="submit" class="btn-green">Próximo passo</button>
        </form>
    </div>
</body>
</html>
