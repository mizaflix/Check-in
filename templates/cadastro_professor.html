<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidade - CheckKids</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; display: flex; justify-content: center; font-family: 'Nunito', sans-serif; margin: 0; }
        .app-container { width: 100%; max-width: 414px; padding: 24px 20px; background: #ffffff; min-height: 100vh; box-sizing: border-box; }
        
        .header-title { color: #028c6a; font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #6c757d; font-size: 0.95rem; text-align: center; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 22px; }
        .form-label { display: block; font-weight: 700; color: #333; margin-bottom: 8px; font-size: 0.95rem; }
        
        .input-field { width: 100%; padding: 12px 16px; border: 1px solid #ced4da; border-radius: 12px; font-size: 0.95rem; box-sizing: border-box; font-family: inherit; }
        
        /* Layout de Opções em Grade / Checkbox */
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; border: 1px solid #edf2f0; }
        .checkbox-label input { width: 18px; height: 18px; accent-color: #028c6a; }

        .btn-submit { background: #028c6a; color: white; border: none; width: 100%; padding: 14px; border-radius: 25px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 12px rgba(2, 140, 106, 0.2); }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 class="header-title">Preencher disponibilidade no mês</h1>
        <p class="subtitle">O sistema organizará a escala ideal de forma automática e justa.</p>

        <form action="{{ url_for('finalizar_cadastro_professor') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Seu Nome Completo</label>
                <input type="text" name="nome" class="input-field" value="{{ current_user.nome }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Telefone / WhatsApp</label>
                <input type="text" name="telefone" class="input-field" placeholder="(00) 00000-0000" required>
            </div>

            <div class="form-group">
                <label class="form-label">Qual a sua função?</label>
                <select name="funcao_papeis" class="input-field" style="background: #fff;">
                    <option value="professor">Professor(a)</option>
                    <option value="auxiliar">Auxiliar</option>
                    <option value="ambos">Ambos (Professor e Auxiliar)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Em quais classes você prefere atuar?</label>
                <div class="options-grid">
                    {% for classe in classes_disponiveis %}
                    <label class="checkbox-label">
                        <input type="checkbox" name="classes_interest" value="{{ classe }}">
                        Classe {{ classe }} anos
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Dias da semana com disponibilidade:</label>
                <div class="options-grid">
                    <label class="checkbox-label"><input type="checkbox" name="dias_disponiveis" value="Domingo"> Domingo</label>
                    <label class="checkbox-label"><input type="checkbox" name="dias_disponiveis" value="Sábado"> Sábado</label>
                    <label class="checkbox-label"><input type="checkbox" name="dias_disponiveis" value="Quarta-feira"> Quarta-feira</label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Salvar e Enviar Disponibilidade</button>
        </form>
    </div>
</body>
</html>
