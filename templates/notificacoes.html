<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notificações - CheckKids</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{margin:0;background:#f4f4f4;display:flex;justify-content:center;font-family:'Nunito',sans-serif}.app{width:100%;max-width:414px;min-height:100vh;background:#fff;padding:24px 20px;box-sizing:border-box}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.top a{color:#028c6a;font-size:1.2rem;text-decoration:none}.top h1{margin:0;color:#028c6a;font-size:1.3rem;font-weight:800}.notice{border:1px solid #edf2f0;border-radius:16px;padding:15px;margin-bottom:12px;background:#fff}.notice.unread{background:#fff8e1;border-left:4px solid #ff7b5a}.meta{font-size:.72rem;color:#8b8b8b;margin-top:8px}.read{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:#028c6a;font-weight:800;font-family:inherit;font-size:.78rem;padding:6px 0;cursor:pointer}.empty{text-align:center;color:#888;margin-top:60px}.empty i{font-size:2.5rem;color:#cfd8d4;margin-bottom:12px}</style>
</head><body><div class="app"><div class="top"><a href="{% if current_user.is_professor or current_user.is_admin %}{{ url_for('dashboard_professor') }}{% else %}{{ url_for('dashboard') }}{% endif %}"><i class="fa-solid fa-arrow-left"></i></a><h1>Notificações</h1></div>
{% if notificacoes %}{% for n in notificacoes %}<div class="notice {% if not n.lida %}unread{% endif %}"><div style="font-weight:800;color:#333"><i class="fa-solid fa-bell" style="color:#028c6a"></i> Aviso</div><div style="margin-top:6px;color:#444;font-size:.88rem;line-height:1.45">{{ n.mensagem }}</div><div class="meta">{{ n.data_hora.strftime('%d/%m/%Y %H:%M') if n.data_hora else '' }}</div>{% if not n.lida %}<form action="{{ url_for('marcar_notificacao_lida', notif_id=n.id) }}" method="POST"><button class="read" type="submit"><i class="fa-solid fa-check"></i> Marcar como lida</button></form>{% endif %}</div>{% endfor %}{% else %}<div class="empty"><i class="fa-regular fa-bell"></i><div>Nenhuma notificação para esta conta.</div></div>{% endif %}</div></body></html>
